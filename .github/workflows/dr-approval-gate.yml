name: DR Approval Gate

# DR request PRs are opened by the boa-dr-incident bot (label dr-incident, branch feature/dr-DR-*).
# Once enough DR approvers approve the latest commit, this starts the GCP Terraform apply.
# The approvals are the trigger; merging the PR afterwards only keeps the record.
on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: dr-approval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Repository variables override these defaults without a code change.
  DR_APPROVERS: ${{ vars.DR_APPROVERS || 'dlcodb94,swoobuntu,qkrwlgh335-lab' }}
  DR_REQUIRED_APPROVALS: ${{ vars.DR_REQUIRED_APPROVALS || '2' }}
  DR_APPLY_REF: ${{ vars.DR_GCP_APPLY_REF || 'feat/gcp-argocd-after-terraform' }}
  DR_DRY_RUN: ${{ vars.DR_DRY_RUN || 'false' }}
  STARTED_LABEL: dr-apply-started

jobs:
  gate:
    name: DR Approval Gate
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.pull_request.labels.*.name, 'dr-incident') &&
      startsWith(github.event.pull_request.head.ref, 'feature/dr-DR-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Count approvals and start GCP apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          comment() {
            gh pr comment "${PR}" -R "${REPO}" --body "$1"
            if [[ -n "${ISSUE:-}" ]]; then
              gh issue comment "${ISSUE}" -R "${REPO}" --body "$1"
            fi
          }

          ISSUE="$(grep -oE 'Refs #[0-9]+' <<< "${PR_BODY}" | head -1 | tr -dc '0-9' || true)"

          labels="$(gh pr view "${PR}" -R "${REPO}" --json labels --jq '[.labels[].name] | join(",")')"
          if [[ ",${labels}," == *",${STARTED_LABEL},"* ]]; then
            echo "GCP apply was already started for this PR."
            exit 0
          fi

          # A DR request may only add its request file; anything else is not a DR approval.
          files="$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate --jq '.[].filename')"
          if grep -qvE '^dr/requests/[^/]+\.md$' <<< "${files}"; then
            comment ":no_entry: DR Approval Gate: 이 PR은 \`dr/requests/*.md\` 외의 파일을 바꿔서 GCP apply를 시작하지 않습니다."
            exit 1
          fi

          # Latest review per user, counted only when it approves the current head commit.
          reviews="$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
            --jq '.[] | select(.state != "COMMENTED") | "\(.user.login) \(.state) \(.commit_id)"')"
          approved="$(awk -v head="${HEAD_SHA}" '{state[$1]=$2; commit[$1]=$3}
            END {for (u in state) if (state[u] == "APPROVED" && commit[u] == head) print u}' <<< "${reviews}" | sort)"

          IFS=',' read -r -a allowed <<< "${DR_APPROVERS// /}"
          counted=()
          for user in ${approved}; do
            for approver in "${allowed[@]}"; do
              [[ "${user}" == "${approver}" ]] && counted+=("${user}")
            done
          done

          count="${#counted[@]}"
          who="${counted[*]:-없음}"
          if (( count < DR_REQUIRED_APPROVALS )); then
            comment ":hourglass_flowing_sand: DR 승인 ${count}/${DR_REQUIRED_APPROVALS} (승인: ${who}). DR 승인권자 ${DR_REQUIRED_APPROVALS}명이 승인하면 GCP Terraform Apply가 시작됩니다."
            exit 0
          fi

          runs_url="https://github.com/${REPO}/actions/workflows/terraform-gcp-apply.yml"
          if [[ "${DR_DRY_RUN}" == "true" ]]; then
            comment ":test_tube: DR 승인 ${count}/${DR_REQUIRED_APPROVALS} 충족 (승인: ${who}). DRY RUN이라 GCP Terraform Apply를 시작하지 않았습니다."
            exit 0
          fi

          gh label create "${STARTED_LABEL}" -R "${REPO}" --color B91C1C \
            --description "DR 승인 충족으로 GCP apply 시작됨" --force
          gh pr edit "${PR}" -R "${REPO}" --add-label "${STARTED_LABEL}"
          gh workflow run terraform-gcp-apply.yml -R "${REPO}" --ref "${DR_APPLY_REF}" -f confirm=true

          comment ":rocket: DR 승인 ${count}/${DR_REQUIRED_APPROVALS} 충족 (승인: ${who}). \`${DR_APPLY_REF}\` 브랜치로 GCP Terraform Apply를 시작했습니다. 실행 현황: ${runs_url}"
