name: AWS Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "AWS 전체 인프라를 실제로 Terraform Apply"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"
  EXPECTED_AWS_ACCOUNT_ID: "769413326616"
  EKS_CLUSTER_NAME: "boa-eks"

jobs:
  validate:
    name: Validate - ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root:
          - persistent
          - aws-core
          - aws-rds
          - aws-cache
          - aws-ops
          - aws-eks
          - aws-eks-platform
          - aws-db-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Verify GitHub Actions and Code Server contract
        run: bash scripts/verify-root-contract.sh "${{ matrix.root }}"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false
      - name: Validate
        run: terraform -chdir="${{ matrix.root }}" validate

  apply:
    name: Sequential AWS Apply
    needs: validate
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 180
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Apply AWS roots in dependency order
        shell: bash
        run: |
          set -euo pipefail
          for root in persistent aws-core aws-rds aws-cache aws-ops aws-eks; do
            bash scripts/terraform-aws-root.sh plan-apply "$root"
          done

      - name: Grant temporary runner access to EKS
        shell: bash
        run: bash scripts/eks-runner-access.sh grant

      - name: Apply EKS platform
        shell: bash
        run: bash scripts/terraform-aws-root.sh plan-apply aws-eks-platform

      - name: Apply DB bootstrap binding
        shell: bash
        run: bash scripts/terraform-aws-root.sh plan-apply aws-db-bootstrap

      - name: Restore baseline EKS access CIDRs
        if: ${{ always() }}
        shell: bash
        run: bash scripts/eks-runner-access.sh restore
