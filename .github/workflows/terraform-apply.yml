name: AWS Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "AWS 전체 인프라를 실제로 Terraform Apply"
        required: true
        default: false
        type: boolean
      allow_destructive_apply:
        description: "삭제 또는 리소스 교체가 포함된 Terraform Apply 허용"
        required: true
        default: false
        type: boolean
      destructive_confirmation_text:
        description: "파괴적 Apply 허용 시 정확히 ALLOW-DESTRUCTIVE-APPLY 입력"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"
  EXPECTED_AWS_ACCOUNT_ID: "769413326616"
  EKS_CLUSTER_NAME: "boa-eks"
  ALLOW_DESTRUCTIVE_APPLY: ${{ inputs.allow_destructive_apply == true && inputs.destructive_confirmation_text == 'ALLOW-DESTRUCTIVE-APPLY' && 'true' || 'false' }}

jobs:
  validate:
    name: Validate - ${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        root:
          - persistent
          - aws-state-backup
          - aws-core
          - aws-rds
          - aws-cache
          - aws-ops
          - aws-eks
          - aws-eks-platform
          - aws-db-bootstrap
          - aws-observability
          - aws-infra-observability
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Verify GitHub Actions and Code Server contract
        run: bash scripts/verify-root-contract.sh "${{ matrix.root }}"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init without backend
        run: terraform -chdir="${{ matrix.root }}" init -backend=false -input=false
      - name: Validate
        run: terraform -chdir="${{ matrix.root }}" validate

  validate_gcp_state_backup:
    name: Validate - gcp-state-backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive gcp-state-backup
      - name: Init without backend
        run: terraform -chdir=gcp-state-backup init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=gcp-state-backup validate

  apply_gcp_state_backup:
    name: Apply - gcp-state-backup
    needs: validate_gcp_state_backup
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials for Terraform backend
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Verify AWS and GCP identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "$GCP_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Init gcp-state-backup
        run: terraform -chdir=gcp-state-backup init -reconfigure -backend-config=../env/backend.hcl -input=false
      - name: Plan gcp-state-backup
        run: terraform -chdir=gcp-state-backup plan -input=false -lock-timeout=5m -out=tfplan
      - name: Show and guard gcp-state-backup plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=gcp-state-backup show -no-color tfplan
          terraform -chdir=gcp-state-backup show -json tfplan |
            jq -e '
              [.resource_changes[]? | select((.change.actions | index("delete")) != null) | .address]
              | if length == 0 then true else error("destructive backup destination actions: " + join(", ")) end
            ' >/dev/null
      - name: Apply gcp-state-backup
        run: terraform -chdir=gcp-state-backup apply -input=false -lock-timeout=5m tfplan

  apply_persistent:
    name: Apply - persistent
    needs: validate
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply persistent
        run: bash scripts/terraform-aws-root.sh plan-apply persistent

  apply_aws_state_backup:
    name: Apply - aws-state-backup
    needs: validate
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-state-backup
        run: bash scripts/terraform-aws-root.sh plan-apply aws-state-backup

  apply_aws_core:
    name: Apply - aws-core
    needs: validate
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-core
        run: bash scripts/terraform-aws-root.sh plan-apply aws-core

  apply_aws_rds:
    name: Apply - aws-rds
    needs: apply_aws_core
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-rds
        run: bash scripts/terraform-aws-root.sh plan-apply aws-rds

  apply_aws_cache:
    name: Apply - aws-cache
    needs: apply_aws_core
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-cache
        run: bash scripts/terraform-aws-root.sh plan-apply aws-cache

  apply_aws_ops:
    name: Apply - aws-ops
    needs: apply_aws_core
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-ops
        run: bash scripts/terraform-aws-root.sh plan-apply aws-ops

  apply_aws_eks:
    name: Apply - aws-eks
    needs: apply_aws_core
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 120
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-eks
        run: bash scripts/terraform-aws-root.sh plan-apply aws-eks

  apply_aws_eks_platform:
    name: Apply - aws-eks-platform
    needs:
      - apply_aws_core
      - apply_aws_eks
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Grant temporary runner access to EKS
        run: bash scripts/eks-runner-access.sh grant
      - name: Apply aws-eks-platform
        run: bash scripts/terraform-aws-root.sh plan-apply aws-eks-platform
      - name: Restore baseline EKS access CIDRs
        if: ${{ always() }}
        run: bash scripts/eks-runner-access.sh restore

  apply_aws_db_bootstrap:
    name: Apply - aws-db-bootstrap
    needs:
      - apply_persistent
      - apply_aws_rds
      - apply_aws_eks
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-db-bootstrap
        run: bash scripts/terraform-aws-root.sh plan-apply aws-db-bootstrap

  apply_aws_observability:
    name: Apply - aws-observability
    needs:
      - apply_aws_eks
      - apply_aws_ops
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-observability
        run: bash scripts/terraform-aws-root.sh plan-apply aws-observability

  apply_aws_infra_observability:
    name: Apply - aws-infra-observability
    needs: validate
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Apply aws-infra-observability
        run: bash scripts/terraform-aws-root.sh plan-apply aws-infra-observability

  backup-state:
    name: Backup Terraform State
    needs:
      - apply_persistent
      - apply_aws_state_backup
      - apply_aws_core
      - apply_aws_rds
      - apply_aws_cache
      - apply_aws_ops
      - apply_aws_eks
      - apply_aws_eks_platform
      - apply_aws_db_bootstrap
      - apply_aws_observability
      - apply_aws_infra_observability
      - apply_gcp_state_backup
    if: ${{ inputs.confirm == true && needs.apply_persistent.result == 'success' && needs.apply_aws_state_backup.result == 'success' && needs.apply_aws_core.result == 'success' && needs.apply_aws_rds.result == 'success' && needs.apply_aws_cache.result == 'success' && needs.apply_aws_ops.result == 'success' && needs.apply_aws_eks.result == 'success' && needs.apply_aws_eks_platform.result == 'success' && needs.apply_aws_db_bootstrap.result == 'success' && needs.apply_aws_observability.result == 'success' && needs.apply_aws_infra_observability.result == 'success' && needs.apply_gcp_state_backup.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
      BACKUP_ROOTS: |
        persistent
        aws-state-backup
        aws-core
        aws-rds
        aws-cache
        aws-ops
        aws-eks
        aws-eks-platform
        aws-db-bootstrap
        aws-observability
        aws-infra-observability
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify AWS and GCP identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"
          test "$(gcloud auth list --filter=status:ACTIVE --format='value(account)')" = "$GCP_SERVICE_ACCOUNT"
          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"

      - name: Collect once and upload Terraform state backup to S3 and GCS
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup_dir=$(mktemp -d "${RUNNER_TEMP}/terraform-state-backup-${timestamp}-${GITHUB_SHA}.XXXXXX")
          cleanup() {
            [[ -n "${backup_dir:-}" && "$backup_dir" == "${RUNNER_TEMP}"/terraform-state-backup-* ]] || return 1
            rm -rf -- "$backup_dir"
          }
          trap cleanup EXIT

          roots=()
          while IFS= read -r root; do
            [[ -n "$root" ]] && roots+=("$root")
          done <<< "$BACKUP_ROOTS"
          (( ${#roots[@]} > 0 ))

          bash scripts/collect-terraform-state-backup.sh "$backup_dir" "${roots[@]}"

          account_id=$(aws sts get-caller-identity --query Account --output text)
          roots_json=$(printf '%s\n' "${roots[@]}" | jq -R . | jq -s .)
          jq -n \
            --arg utc_timestamp "$timestamp" \
            --arg github_sha "$GITHUB_SHA" \
            --arg github_run_id "$GITHUB_RUN_ID" \
            --arg git_ref "$GITHUB_REF" \
            --arg aws_account_id "$account_id" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --argjson backup_roots "$roots_json" \
            '{
              schema_version: 1,
              utc_timestamp: $utc_timestamp,
              github_sha: $github_sha,
              github_run_id: $github_run_id,
              git_ref: $git_ref,
              aws_account_id: $aws_account_id,
              source_repository: $source_repository,
              backup_roots: $backup_roots
            }' > "$backup_dir/metadata.json"

          (
            cd "$backup_dir"
            state_files=()
            for root in "${roots[@]}"; do
              state_files+=("$root.tfstate")
            done
            sha256sum "${state_files[@]}" > SHA256SUMS
          )

          backup_bucket=$(terraform -chdir=aws-state-backup output -raw bucket_name)
          backup_region=$(terraform -chdir=aws-state-backup output -raw bucket_region)
          backup_prefix=$(terraform -chdir=aws-state-backup output -raw object_prefix)
          object_prefix="${backup_prefix}/${timestamp}/${GITHUB_SHA}"

          terraform -chdir=gcp-state-backup init \
            -reconfigure \
            -backend-config="$GITHUB_WORKSPACE/env/backend.hcl" \
            -input=false >/dev/null
          gcs_bucket=$(terraform -chdir=gcp-state-backup output -raw bucket_name)
          gcs_location=$(terraform -chdir=gcp-state-backup output -raw bucket_location)
          gcs_prefix=$(terraform -chdir=gcp-state-backup output -raw object_prefix)
          gcs_object_prefix="${gcs_prefix}/${timestamp}/${GITHUB_SHA}"

          bash scripts/upload-terraform-state-backup-s3.sh \
            "$backup_dir" \
            "$backup_bucket" \
            "$backup_region" \
            "$object_prefix"

          bash scripts/upload-terraform-state-backup-gcs.sh \
            "$backup_dir" \
            "$gcs_bucket" \
            "$gcs_location" \
            "$gcs_object_prefix"

          echo "Terraform state backup uploaded and verified: s3://${backup_bucket}/${object_prefix}/"
          echo "Terraform state backup uploaded and verified: gs://${gcs_bucket}/${gcs_object_prefix}/"
