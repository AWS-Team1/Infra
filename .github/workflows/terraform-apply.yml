name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: dev-infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------
      # AWS authentication
      # -------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          echo "AWS account: ${ACCOUNT_ID}"

          if [ "${ACCOUNT_ID}" != "769413326616" ]; then
            echo "Unexpected AWS account: ${ACCOUNT_ID}"
            exit 1
          fi

      # -------------------------------------------------
      # GCP authentication
      # -------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify GCP project
        shell: bash
        run: |
          set -euo pipefail

          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"

          PROJECT_ID="$(gcloud config get-value project)"

          echo "GCP project: ${PROJECT_ID}"

          if [ "${PROJECT_ID}" != "kdt4-1-506106" ]; then
            echo "Unexpected GCP project: ${PROJECT_ID}"
            exit 1
          fi

      # -------------------------------------------------
      # GitHub-hosted runner public IP
      # -------------------------------------------------
      - name: Detect runner public IP
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '\n')"

          if [[ ! "${RUNNER_IP}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Invalid runner public IP: ${RUNNER_IP}"
            exit 1
          fi

          echo "Runner public IP: ${RUNNER_IP}"

          echo "RUNNER_PUBLIC_IP=${RUNNER_IP}" >> "$GITHUB_ENV"

          echo "TF_VAR_public_access_cidrs=[\"${RUNNER_IP}/32\"]" \
            >> "$GITHUB_ENV"

          echo "TF_VAR_master_authorized_cidrs=[{\"cidr_block\":\"${RUNNER_IP}/32\",\"display_name\":\"github-actions\"}]" \
            >> "$GITHUB_ENV"

      - name: Verify Terraform network variables
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner IP: ${RUNNER_PUBLIC_IP}"
          echo "EKS CIDRs: ${TF_VAR_public_access_cidrs}"
          echo "GKE CIDRs: ${TF_VAR_master_authorized_cidrs}"

      # -------------------------------------------------
      # Terraform
      # -------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform version
        run: terraform version

      - name: AWS Core - Init
        working-directory: aws-core
        run: terraform init -input=false

      - name: AWS Core - Validate
        working-directory: aws-core
        run: terraform validate

      - name: AWS Core - Plan
        working-directory: aws-core
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: AWS Core - Show Plan
        working-directory: aws-core
        run: terraform show -no-color tfplan
        