name: AWS Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "AWS 인프라 Destroy 실행"
        required: true
        default: false
        type: boolean
      confirmation_text:
        description: "정확히 DESTROY-AWS 입력"
        required: true
        type: string
      full_teardown:
        description: "persistent Secret과 telemetry archive의 모든 객체/버전까지 명시적으로 제거"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"
  EXPECTED_AWS_ACCOUNT_ID: "769413326616"
  EKS_CLUSTER_NAME: "boa-eks"

jobs:
  guard:
    name: Destroy Guard
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      vpc_id: ${{ steps.core.outputs.vpc_id }}
      destroy_core: ${{ steps.core_guard.outputs.destroy_core }}
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm_destroy }}" == "true" ]]
          [[ "${{ inputs.confirmation_text }}" == "DESTROY-AWS" ]]

      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Read current VPC
        id: core
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=aws-core init -reconfigure -backend-config=../env/backend.hcl -input=false
          vpc_id=$(terraform -chdir=aws-core output -raw vpc_id 2>/dev/null || true)
          echo "vpc_id=$vpc_id" >> "$GITHUB_OUTPUT"

      - name: Determine whether core can be destroyed
        id: core_guard
        shell: bash
        env:
          VPC_ID: ${{ steps.core.outputs.vpc_id }}
        run: |
          set -euo pipefail
          destroy_core=true
          reasons=()

          if [[ -z "$VPC_ID" ]]; then
            echo "Core VPC ID is empty; aws-core will be preserved because dependency checks cannot be trusted."
            destroy_core=false
            reasons+=("core VPC ID unavailable")
          else
            dms_instances=$(aws dms describe-replication-instances \
              --query "ReplicationInstances[?ReplicationSubnetGroup.VpcId=='$VPC_ID'].ReplicationInstanceIdentifier" \
              --output text)
            dms_subnet_groups=$(aws dms describe-replication-subnet-groups \
              --query "ReplicationSubnetGroups[?VpcId=='$VPC_ID'].ReplicationSubnetGroupIdentifier" \
              --output text)

            if [[ -n "$dms_instances" ]]; then
              echo "DMS replication instances attached to core VPC: $dms_instances"
              destroy_core=false
              reasons+=("DMS replication instance uses core VPC")
            else
              echo "DMS replication instances attached to core VPC: none"
            fi

            if [[ -n "$dms_subnet_groups" ]]; then
              echo "DMS replication subnet groups attached to core VPC: $dms_subnet_groups"
              destroy_core=false
              reasons+=("DMS replication subnet group uses core VPC")
            else
              echo "DMS replication subnet groups attached to core VPC: none"
            fi

            vpn_gateways=$(aws ec2 describe-vpn-gateways --filters "Name=attachment.vpc-id,Values=$VPC_ID" "Name=attachment.state,Values=attaching,attached,detaching" --query 'VpnGateways[].VpnGatewayId' --output text)
            if [[ -n "$vpn_gateways" ]]; then
              echo "VPN gateways attached to core VPC: $vpn_gateways"
              destroy_core=false
              reasons+=("VPN gateway is attached to core VPC")
            else
              echo "VPN gateways attached to core VPC: none"
            fi
          fi

          if [[ "$destroy_core" == "true" ]]; then
            echo "destroy_core=true: no DMS or VPN dependency uses core VPC $VPC_ID"
          else
            printf 'destroy_core=false: %s\n' "$(IFS='; '; echo "${reasons[*]}")"
          fi
          echo "destroy_core=$destroy_core" >> "$GITHUB_OUTPUT"

  destroy:
    name: Staged Parallel AWS Destroy
    needs: guard
    runs-on: ubuntu-latest
    environment: dev-infra
    timeout-minutes: 240
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ORIGINAL_VPC_ID: ${{ needs.guard.outputs.vpc_id }}
      DESTROY_CORE: ${{ needs.guard.outputs.destroy_core }}
    steps:
      - name: Checkout Infra
        uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: azure/setup-kubectl@v4

      - name: Verify AWS identity
        shell: bash
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_AWS_ACCOUNT_ID"

      - name: Grant temporary runner access to EKS
        shell: bash
        run: bash scripts/eks-runner-access.sh grant

      - name: Detect whether EKS exists
        id: eks
        shell: bash
        run: |
          set -euo pipefail
          if aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null 2>&1; then
            aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: EKS external pre-clean
        if: ${{ steps.eks.outputs.exists == 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_NAMESPACE="bank-of-anthos"
          APP_INGRESS="boa-ingress"
          APP_STACK="${APP_NAMESPACE}/${APP_INGRESS}"
          ARGO_NAMESPACE="argocd"
          ARGO_TGB="argocd-server"
          OBS_NAMESPACE="monitoring"
          GRAFANA_TGB="grafana"
          KARPENTER_NODEPOOL="default"
          KARPENTER_NODECLASS="default"

          echo "ARGOCD_RESTORE_REQUIRED=false" >> "$GITHUB_ENV"

          wait_namespaced_absent() {
            local namespace=$1 resource=$2 timeout_seconds=$3
            local deadline=$(( $(date +%s) + timeout_seconds ))
            local current
            while :; do
              current=$(kubectl -n "$namespace" get "$resource" --ignore-not-found -o name)
              [[ -z "$current" ]] && return 0
              (( $(date +%s) < deadline )) || {
                echo "Timed out waiting for $namespace/$resource deletion: $current" >&2
                return 1
              }
              sleep 10
            done
          }

          wait_cluster_absent() {
            local resource=$1 timeout_seconds=$2
            local deadline=$(( $(date +%s) + timeout_seconds ))
            local current
            while :; do
              current=$(kubectl get "$resource" --ignore-not-found -o name)
              [[ -z "$current" ]] && return 0
              (( $(date +%s) < deadline )) || {
                echo "Timed out waiting for $resource deletion: $current" >&2
                return 1
              }
              sleep 10
            done
          }

          # Stop Argo CD before deleting resources so it cannot recreate them.
          if [[ -n "$(kubectl get namespace "$ARGO_NAMESPACE" --ignore-not-found -o name)" ]]; then
            mapfile -t controllers < <(
              kubectl -n "$ARGO_NAMESPACE" get statefulset \
                -l app.kubernetes.io/name=argocd-application-controller \
                --ignore-not-found -o name
            )
            ((${#controllers[@]} <= 1)) || {
              echo "Expected at most one Argo CD application-controller: ${controllers[*]}" >&2
              exit 1
            }
            if ((${#controllers[@]} == 1)); then
              controller_replicas=$(kubectl -n "$ARGO_NAMESPACE" get "${controllers[0]}" \
                -o jsonpath='{.spec.replicas}')
              [[ "$controller_replicas" =~ ^[0-9]+$ ]] || {
                echo "Invalid Argo CD application-controller replica count: $controller_replicas" >&2
                exit 1
              }
              {
                echo "ARGOCD_RESTORE_REQUIRED=true"
                echo "ARGOCD_CONTROLLER_NAMESPACE=$ARGO_NAMESPACE"
                echo "ARGOCD_CONTROLLER_RESOURCE=${controllers[0]}"
                echo "ARGOCD_CONTROLLER_REPLICAS=$controller_replicas"
              } >> "$GITHUB_ENV"
              kubectl -n "$ARGO_NAMESPACE" scale "${controllers[0]}" --replicas=0
              deadline=$(( $(date +%s) + 300 ))
              while :; do
                pods=$(kubectl -n "$ARGO_NAMESPACE" get pod \
                  -l app.kubernetes.io/name=argocd-application-controller \
                  --ignore-not-found -o name)
                [[ -z "$pods" ]] && break
                (( $(date +%s) < deadline )) || {
                  echo "Timed out waiting for Argo CD application-controller pods: $pods" >&2
                  exit 1
                }
                sleep 10
              done
            else
              echo "Argo CD application-controller is already absent."
            fi
          else
            echo "Argo CD namespace is already absent."
          fi

          # Delete only this project's application Ingress.
          if [[ -n "$(kubectl get namespace "$APP_NAMESPACE" --ignore-not-found -o name)" ]]; then
            kubectl -n "$APP_NAMESPACE" delete "ingress/$APP_INGRESS" \
              --ignore-not-found --wait=false
            wait_namespaced_absent "$APP_NAMESPACE" "ingress/$APP_INGRESS" 900
          else
            echo "$APP_NAMESPACE namespace is already absent."
          fi

          # Delete only the Terraform ops target group's binding.
          if [[ -n "$(kubectl get crd targetgroupbindings.elbv2.k8s.aws --ignore-not-found -o name)" ]] && \
             [[ -n "$(kubectl get namespace "$ARGO_NAMESPACE" --ignore-not-found -o name)" ]]; then
            kubectl -n "$ARGO_NAMESPACE" delete "targetgroupbinding/$ARGO_TGB" \
              --ignore-not-found --wait=false
            wait_namespaced_absent "$ARGO_NAMESPACE" "targetgroupbinding/$ARGO_TGB" 900
          else
            echo "TargetGroupBinding CRD or argocd namespace is already absent."
          fi

          # Delete only the Grafana binding declared by the GitOps observability overlay.
          # LBC remains alive until this binding and its AWS-side targets are released.
          if [[ -n "$(kubectl get crd targetgroupbindings.elbv2.k8s.aws --ignore-not-found -o name)" ]] && \
             [[ -n "$(kubectl get namespace "$OBS_NAMESPACE" --ignore-not-found -o name)" ]]; then
            kubectl -n "$OBS_NAMESPACE" delete "targetgroupbinding/$GRAFANA_TGB" \
              --ignore-not-found --wait=false
            wait_namespaced_absent "$OBS_NAMESPACE" "targetgroupbinding/$GRAFANA_TGB" 900
          else
            echo "TargetGroupBinding CRD or monitoring namespace is already absent."
          fi

          # Capture the controller-created profile before EC2NodeClass finalization.
          instance_profile=""
          if [[ -n "$(kubectl get crd ec2nodeclasses.karpenter.k8s.aws --ignore-not-found -o name)" ]]; then
            instance_profile=$(kubectl get "ec2nodeclass/$KARPENTER_NODECLASS" \
              --ignore-not-found -o jsonpath='{.status.instanceProfile}')
            instance_profile=${instance_profile##*/}
          fi

          # Keep Karpenter alive while it drains and terminates only the default pool.
          if [[ -n "$(kubectl get crd nodepools.karpenter.sh --ignore-not-found -o name)" ]]; then
            kubectl delete "nodepool/$KARPENTER_NODEPOOL" --ignore-not-found --wait=false

            if [[ -n "$(kubectl get crd nodeclaims.karpenter.sh --ignore-not-found -o name)" ]]; then
              kubectl delete nodeclaims.karpenter.sh \
                -l "karpenter.sh/nodepool=$KARPENTER_NODEPOOL" \
                --ignore-not-found --wait=false
              deadline=$(( $(date +%s) + 1200 ))
              while :; do
                claims=$(kubectl get nodeclaims.karpenter.sh \
                  -l "karpenter.sh/nodepool=$KARPENTER_NODEPOOL" -o name)
                [[ -z "$claims" ]] && break
                (( $(date +%s) < deadline )) || {
                  echo "Timed out waiting for project NodeClaims: $claims" >&2
                  exit 1
                }
                sleep 10
              done
            fi

            wait_cluster_absent "nodepool/$KARPENTER_NODEPOOL" 300
          else
            echo "Karpenter NodePool CRD is already absent."
          fi

          if [[ -n "$(kubectl get crd ec2nodeclasses.karpenter.k8s.aws --ignore-not-found -o name)" ]]; then
            kubectl delete "ec2nodeclass/$KARPENTER_NODECLASS" \
              --ignore-not-found --wait=false
            wait_cluster_absent "ec2nodeclass/$KARPENTER_NODECLASS" 600
          else
            echo "Karpenter EC2NodeClass CRD is already absent."
          fi

          # Do not destroy aws-eks-platform until controller-owned AWS dependencies
          # for the exact application stack and Karpenter pool are gone.
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            remaining=0

            app_albs=$(aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --resource-type-filters elasticloadbalancing:loadbalancer \
              --tag-filters "Key=ingress.k8s.aws/stack,Values=$APP_STACK" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text)
            app_target_groups=$(aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --resource-type-filters elasticloadbalancing:targetgroup \
              --tag-filters "Key=ingress.k8s.aws/stack,Values=$APP_STACK" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text)
            app_security_groups=$(aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --resource-type-filters ec2:security-group \
              --tag-filters "Key=ingress.k8s.aws/stack,Values=$APP_STACK" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text)
            app_enis=$(aws ec2 describe-network-interfaces \
              --region "$AWS_REGION" \
              --filters 'Name=description,Values=*k8s-bankofan-boaingr*' \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)
            karpenter_instances=$(aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                'Name=tag:Name,Values=boa-eks-karpenter-node' \
                'Name=tag:Project,Values=boa' \
                'Name=tag:ManagedBy,Values=karpenter' \
                'Name=instance-state-name,Values=pending,running,stopping,shutting-down' \
              --query 'Reservations[].Instances[].InstanceId' --output text)

            for value in "$app_albs" "$app_target_groups" "$app_security_groups" "$app_enis" "$karpenter_instances"; do
              if [[ -n "$value" && "$value" != "None" ]]; then
                echo "Waiting for controller-owned AWS dependency: $value"
                remaining=1
              fi
            done

            if [[ -n "$instance_profile" ]]; then
              if profile_output=$(aws iam get-instance-profile \
                --instance-profile-name "$instance_profile" \
                --query 'InstanceProfile.Arn' --output text 2>&1); then
                echo "Waiting for Karpenter instance profile: $profile_output"
                remaining=1
              elif grep -q 'NoSuchEntity' <<<"$profile_output"; then
                instance_profile=""
              else
                echo "$profile_output" >&2
                exit 1
              fi
            fi

            (( remaining == 0 )) && break
            (( $(date +%s) < deadline )) || {
              echo "Controller-owned AWS dependencies remain; refusing Terraform destroy." >&2
              exit 1
            }
            sleep 15
          done

      # Each root has its own backend state key and its own saved tfplan-destroy,
      # so the plans can be built concurrently. Every root is planned before any
      # destroy starts; a single failed plan stops the workflow here.
      - name: Preflight all root destroy plans in parallel
        shell: bash
        run: |
          set -euo pipefail
          roots=(aws-db-bootstrap aws-observability)
          if [[ "${{ steps.eks.outputs.exists }}" == "true" ]]; then
            roots+=(aws-eks-platform)
          fi
          roots+=(aws-eks aws-ops aws-cache aws-rds)
          if [[ "$DESTROY_CORE" == "true" ]]; then
            roots+=(aws-core)
          else
            echo "aws-core preserved because DMS/VPN dependency remains"
          fi
          if [[ "${{ inputs.full_teardown }}" == "true" ]]; then
            roots+=(persistent)
          fi
          bash scripts/run-terraform-roots-parallel.sh plan-destroy "${roots[@]}"

      # Consumers of aws-eks, aws-rds, and aws-ops. They do not depend on each
      # other, but all of them must be gone before the main phase starts.
      - name: Destroy prerequisite roots in parallel
        shell: bash
        run: |
          set -euo pipefail
          roots=(aws-db-bootstrap aws-observability)
          if [[ "${{ steps.eks.outputs.exists }}" == "true" ]]; then
            roots+=(aws-eks-platform)
          fi
          bash scripts/run-terraform-roots-parallel.sh apply-destroy "${roots[@]}"

      # These four only consume aws-core and share no Terraform or security-group
      # references, so the long EKS and RDS deletions overlap.
      - name: Destroy EKS, ops, cache, and RDS in parallel
        shell: bash
        run: bash scripts/run-terraform-roots-parallel.sh apply-destroy aws-eks aws-ops aws-cache aws-rds

      - name: Wait for load balancers and conditionally destroy core
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 900 ))
          while [[ -n "$ORIGINAL_VPC_ID" ]]; do
            lbs=$(aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='$ORIGINAL_VPC_ID'].LoadBalancerArn" --output text)
            [[ -z "$lbs" ]] && break
            (( $(date +%s) < deadline )) || {
              echo "Load balancers still remain: $lbs" >&2
              exit 1
            }
            sleep 10
          done

          if [[ "$DESTROY_CORE" == "true" ]]; then
            bash scripts/terraform-aws-root.sh apply-destroy aws-core
          else
            echo "aws-core preserved because DMS/VPN dependency remains"
          fi

      - name: Explicit full teardown of persistent resources
        if: ${{ inputs.full_teardown == true }}
        shell: bash
        run: bash scripts/terraform-aws-root.sh apply-destroy persistent

      - name: Verify routine infrastructure deletion
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" >/dev/null 2>&1 && failed=1 || true
          [[ -z "$(aws rds describe-db-instances --query "DBInstances[?DBInstanceIdentifier=='boa-postgres'].DBInstanceIdentifier" --output text)" ]] || failed=1
          [[ -z "$(aws elasticache describe-serverless-caches --query "ServerlessCaches[?ServerlessCacheName=='boa-valkey'].ServerlessCacheName" --output text)" ]] || failed=1
          [[ -z "$(aws logs describe-log-groups --log-group-name-prefix "/aws/eks/$EKS_CLUSTER_NAME/" --query "logGroups[?logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/application' || logGroupName=='/aws/eks/$EKS_CLUSTER_NAME/otel-emf'].logGroupName" --output text)" ]] || failed=1
          [[ -z "$(aws logs describe-log-groups --log-group-name-prefix "/aws/logs-data-protection/$EKS_CLUSTER_NAME" --query "logGroups[?logGroupName=='/aws/logs-data-protection/$EKS_CLUSTER_NAME'].logGroupName" --output text)" ]] || failed=1
          aws elbv2 describe-target-groups --names boa-grafana-tg >/dev/null 2>&1 && failed=1 || true
          aws iam get-role --role-name "$EKS_CLUSTER_NAME-otel-collector-role" >/dev/null 2>&1 && failed=1 || true
          aws iam get-role --role-name "$EKS_CLUSTER_NAME-grafana-role" >/dev/null 2>&1 && failed=1 || true
          public_zone_id=$(aws route53 list-hosted-zones-by-name \
            --dns-name bespinglobal.site. --output json |
            jq -r 'first(.HostedZones[] | select(.Name == "bespinglobal.site." and .Config.PrivateZone == false) | .Id) // empty')
          [[ -n "$public_zone_id" ]] || {
            echo "Public hosted zone not found during Grafana record verification." >&2
            failed=1
          }
          if [[ -n "$public_zone_id" ]]; then
            grafana_records=$(aws route53 list-resource-record-sets \
              --hosted-zone-id "$public_zone_id" \
              --query "ResourceRecordSets[?Name=='grafana.bespinglobal.site.' && Type=='A'].Name" \
              --output text)
            [[ -z "$grafana_records" ]] || failed=1
          fi

          telemetry_bucket="boa-telemetry-archive-$EXPECTED_AWS_ACCOUNT_ID"
          for secret in /boa/observability/whatap /boa/observability/grafana; do
            if [[ "${{ inputs.full_teardown }}" == "true" ]]; then
              deadline=$(( $(date +%s) + 120 ))
              while :; do
                if secret_output=$(aws secretsmanager describe-secret --secret-id "$secret" 2>&1); then
                  (( $(date +%s) < deadline )) || {
                    echo "Persistent Secret still exists after full teardown: $secret" >&2
                    failed=1
                    break
                  }
                  sleep 5
                elif grep -q 'ResourceNotFoundException' <<<"$secret_output"; then
                  break
                else
                  echo "$secret_output" >&2
                  failed=1
                  break
                fi
              done
            else
              aws secretsmanager describe-secret --secret-id "$secret" >/dev/null 2>&1 || failed=1
            fi
          done
          telemetry_buckets=$(aws s3api list-buckets \
            --query "Buckets[?Name=='$telemetry_bucket'].Name" --output text)
          if [[ "${{ inputs.full_teardown }}" == "true" ]]; then
            [[ -z "$telemetry_buckets" ]] || failed=1
          else
            [[ "$telemetry_buckets" == "$telemetry_bucket" ]] || failed=1
          fi
          if [[ -n "$ORIGINAL_VPC_ID" ]]; then
            current_vpc_id=$(aws ec2 describe-vpcs --vpc-ids "$ORIGINAL_VPC_ID" --query 'Vpcs[].VpcId' --output text 2>/dev/null || true)
            if [[ "$DESTROY_CORE" == "true" ]]; then
              [[ -z "$current_vpc_id" ]] || {
                echo "Core VPC still exists after aws-core destroy: $current_vpc_id" >&2
                failed=1
              }
            else
              [[ "$current_vpc_id" == "$ORIGINAL_VPC_ID" ]] || {
                echo "Core VPC was expected to remain but was not found: $ORIGINAL_VPC_ID" >&2
                failed=1
              }
            fi
          fi
          [[ "$failed" -eq 0 ]]

      - name: Restore Argo CD reconciliation when EKS remains
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${ARGOCD_RESTORE_REQUIRED:-false}" != "true" ]]; then
            echo "Argo CD application-controller did not exist before pre-clean; restore is not required."
            exit 0
          fi

          if ! aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME" >/dev/null 2>&1; then
            echo "EKS cluster is absent; skipping Argo CD restore."
            exit 0
          fi

          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl --request-timeout=20s get --raw='/readyz' >/dev/null

          [[ "${ARGOCD_CONTROLLER_REPLICAS:-}" =~ ^[0-9]+$ ]] || {
            echo "Stored Argo CD replica count is missing or invalid." >&2
            exit 1
          }

          kubectl -n "$ARGOCD_CONTROLLER_NAMESPACE" scale \
            "$ARGOCD_CONTROLLER_RESOURCE" \
            --replicas="$ARGOCD_CONTROLLER_REPLICAS"
          kubectl -n "$ARGOCD_CONTROLLER_NAMESPACE" rollout status \
            "$ARGOCD_CONTROLLER_RESOURCE" \
            --timeout=5m

          if (( ARGOCD_CONTROLLER_REPLICAS > 0 )); then
            kubectl -n "$ARGOCD_CONTROLLER_NAMESPACE" wait \
              --for=condition=Ready pod \
              -l app.kubernetes.io/name=argocd-application-controller \
              --timeout=5m
          else
            pods=$(kubectl -n "$ARGOCD_CONTROLLER_NAMESPACE" get pod \
              -l app.kubernetes.io/name=argocd-application-controller \
              --ignore-not-found -o name)
            [[ -z "$pods" ]] || {
              echo "Argo CD controller was originally scaled to zero but pods remain: $pods" >&2
              exit 1
            }
          fi

      - name: Restore baseline EKS access CIDRs when the cluster remains
        if: ${{ always() }}
        shell: bash
        run: bash scripts/eks-runner-access.sh restore
