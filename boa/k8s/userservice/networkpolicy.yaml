---
# Source: bank-of-anthos/templates/userservice/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: userservice-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: userservice
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
  egress:
    # RDS project-postgres (VPC 대역 전체 허용 - 실제 RDS 서브넷 CIDR 확인되면 좁힐 것)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 5432
    - ports:                      # default-deny 때문에 DNS egress 필수
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

