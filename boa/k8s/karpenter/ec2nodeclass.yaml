apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest

  # Terraform이 EKS Managed Node Group용으로 만든 역할을 재사용한다.
  role: boa-eks-node-role

  # Terraform의 Private Subnet 태그와 일치해야 한다.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks

  # Terraform이 EKS Cluster Security Group에 붙인 태그와 일치해야 한다.
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Name: boa-eks-karpenter-node
    Project: boa
    ManagedBy: karpenter

