apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        workload-type: application
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium", "t3.large"]

  # Karpenter가 만든 노드만 계산한다. 기존 Managed Node Group은 포함하지 않는다.
  limits:
    cpu: "8"
    memory: 16Gi

  disruption:
    # 실행 중인 일반 Pod를 옮겨서까지 노드를 축소하지 않는다.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"

